name: Build Docker Image

on:
  push:
    branches: [dev, stable, release]
    tags: ['v*']
  pull_request:
    branches: [dev, stable, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: lswl/vertex

jobs:
  check:
    name: Lint and build frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webui/package-lock.json

      # Static checks do not need SQLite bindings or a Chromium download.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ci --prefix webui --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: |
          npm run eslint
          npm run eslint --prefix webui
          npx --no-install eslint --no-ignore .github/scripts/build-version.cjs webui/prepare-themes.js webui/dark.js webui/light.js webui/cyber.js

      - name: Prepare build metadata
        run: node .github/scripts/build-version.cjs

      - name: Prepare themes
        run: npm run prepare:themes --prefix webui

      - name: Build frontend
        run: npm run build --prefix webui

      - name: Upload frontend
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: frontend-${{ github.sha }}
          path: app/static/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish multi-platform image
    needs: check
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/dev' ||
       github.ref == 'refs/heads/stable' ||
       github.ref == 'refs/heads/release' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: frontend-${{ github.sha }}
          path: app/static/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/stable' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vertex-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=vertex-${{ github.ref_name }}
